<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>For Yashfa ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#080712;--rose:#ff78a9;--pink:#ffb6ce;--gold:#ffdca7;--white:#fff8fc;--dim:#c8bdd0;--glass:rgba(255,255,255,.075);--line:rgba(255,180,210,.28)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Outfit,sans-serif;color:var(--white);background:radial-gradient(circle at 50% -5%,#4d1d58 0,transparent 45%),radial-gradient(circle at 10% 70%,#28163d 0,transparent 35%),linear-gradient(#070611,#11091b 55%,#07050d);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 80% 20%,#fff,transparent),radial-gradient(1px 1px at 55% 75%,#fff,transparent),radial-gradient(1px 1px at 35% 88%,#fff,transparent);background-size:260px 260px;opacity:.45}.top{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;z-index:20}.pill{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);padding:9px 14px;border-radius:99px;color:var(--pink);font-size:12px}.music{cursor:pointer}.hero{min-height:100vh;display:grid;place-items:center;text-align:center;padding:80px 22px 50px;position:relative;z-index:2}.hero-inner{max-width:850px}.eyebrow{display:inline-flex;gap:9px;align-items:center;padding:9px 17px;border:1px solid var(--line);border-radius:99px;background:var(--glass);color:var(--gold);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:var(--rose);box-shadow:0 0 16px var(--rose)}h1{font-family:'Playfair Display',serif;font-size:clamp(4rem,13vw,9rem);line-height:.88;margin:28px 0 22px;font-style:italic;background:linear-gradient(100deg,#fff,var(--pink),var(--rose),var(--gold));background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite;filter:drop-shadow(0 0 28px #ff78a944)}@keyframes shine{to{background-position:-250%}}.sub{font-size:clamp(1rem,2.5vw,1.35rem);color:var(--dim);max-width:600px;margin:auto;line-height:1.8}.btn{margin-top:35px;border:0;border-radius:999px;padding:16px 27px;font:600 15px Outfit;cursor:pointer;color:#281020;background:linear-gradient(120deg,#ffb5cf,#ffdca7);box-shadow:0 15px 45px #ff78a944;transition:.25s}.btn:hover{transform:translateY(-4px) scale(1.02)}.scroll{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);font-size:11px;color:#9f91a9;letter-spacing:.2em}.float{position:absolute;bottom:-20px;font-size:20px;animation:rise linear forwards;opacity:0}@keyframes rise{15%{opacity:.8}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}#fx{position:fixed;inset:0;pointer-events:none;z-index:15}footer{text-align:center;color:#8e8198;padding:25px;font-size:12px}
</style></head><body>
<div class="top"><div class="pill">A little surprise ♡</div></div><canvas id="fx"></canvas>
<section class="hero"><div class="hero-inner"><div class="eyebrow"><span class="dot"></span> made especially for Yashfa</div><h1>Happy Birthday,<br>Yashfa ♡</h1><p class="sub">Today is not just another day... it is a little celebration of the wonderful person you are. I made something special for you. ✨</p><button class="btn" id="open"><i class="fa-solid fa-gift"></i> &nbsp; Open Your Surprise</button></div><div class="scroll">SCROLL ↓</div></section>
<footer>made with lots of good wishes ♡</footer>
<audio id="bg" loop><source src="assets/audio/romantic.mp3" type="audio/mpeg"></audio><audio id="boom"><source src="assets/audio/firework.mp3" type="audio/mpeg"></audio>
<script>
const bg=document.getElementById('bg');let playing=false;
const boomPool=Array.from({length:8},()=>{const a=new Audio('assets/audio/firework.mp3');a.preload='auto';a.volume=.32;return a});let soundUnlocked=false;
function unlockSounds(){if(soundUnlocked)return; soundUnlocked=true; boomPool.forEach(a=>{a.muted=true; const p=a.play(); if(p)p.then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})});}
function startMusic(){bg.volume=.25;const p=bg.play();if(p)p.then(()=>{playing=true;localStorage.setItem('yashfaMusic','on')}).catch(()=>{})}
document.addEventListener('pointerdown',()=>{unlockSounds();if(!playing)startMusic()},{once:true});
startMusic();
const c=document.getElementById('fx'),x=c.getContext('2d');let ps=[];function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}resize();addEventListener('resize',resize);function burst(X,Y){for(let i=0;i<70;i++){let a=Math.random()*6.28,v=2+Math.random()*5;ps.push({x:X,y:Y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,col:['#ff78a9','#ffdca7','#fff','#cda8ff'][Math.floor(Math.random()*4)]})}if(soundUnlocked){const q=boomPool[Math.floor(Math.random()*boomPool.length)];q.currentTime=0;q.muted=false;q.play().catch(()=>{});}}
function loop(){x.clearRect(0,0,c.width,c.height);ps=ps.filter(p=>p.life>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.life-=.018;x.globalAlpha=p.life;x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,2*devicePixelRatio,0,7);x.fill()});x.globalAlpha=1;requestAnimationFrame(loop)}loop();
function hearts(n=18){for(let i=0;i<n;i++){let e=document.createElement('span');e.className='float';e.textContent=['♡','✦','🌸','♥'][Math.floor(Math.random()*4)];e.style.left=Math.random()*100+'vw';e.style.color=['#ff8fb5','#ffd3e1','#d5b4ff','#ffdca7'][Math.floor(Math.random()*4)];e.style.animationDuration=4+Math.random()*5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),9000)}}
for(let i=0;i<4;i++)setTimeout(()=>burst(Math.random()*innerWidth*devicePixelRatio,innerHeight*(.15+Math.random()*.35)*devicePixelRatio),1000+i*900);setInterval(()=>{if(!document.hidden)burst(Math.random()*innerWidth*devicePixelRatio,innerHeight*(.1+Math.random()*.4)*devicePixelRatio)},2600);
document.getElementById('open').onclick=()=>{unlockSounds();startMusic();localStorage.setItem('yashfaMusic','on');hearts(30);burst(innerWidth*.5*devicePixelRatio,innerHeight*.28*devicePixelRatio);document.body.style.transition='opacity .7s';document.body.style.opacity='.15';setTimeout(()=>location.href='main.html',600)};
</script></body></html>
